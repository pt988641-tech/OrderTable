
<!DOCTYPE html>
<html>
<head>
    <title>Order Table</title>

    <style>
        table {
            width: 92%;
            margin: 15px 10px;
            border-collapse: collapse;
            table-layout: fixed;
            font-family: "Times New Roman", serif;
            font-size: 30px;
        }

        col:nth-child(1) { width: 10%; }
        col:nth-child(2) { width: 20%; }
        col:nth-child(3) { width: 33.3%; }
        col:nth-child(4) { width: 21.5%; }
        col:nth-child(5) { width: 15.2%; }

        td {
    border: 2px solid #000000;
    padding: 15px;
}

        .bold {
            font-weight: bold;
            text-align: center;
        }

        .right {
            text-align: right;
        }
    </style>
</head>

<body>

<table>
    <colgroup>
        <col>
        <col>
        <col>
        <col>
        <col>
    </colgroup>

    <tr>
        <td rowspan="11" class="bold">TCB</td>
        <td class="bold">Order no:</td>
        <td colspan="3">#ABC001</td>
    </tr>

    <tr>
        <td class="bold">Order Date:</td>
        <td colspan="3">23-Mar-2016</td>
    </tr>

    <tr>
        <td colspan="4" class="bold">Customer</td>
    </tr>

    <tr>
        <td class="bold">Name:</td>
        <td colspan="3">John Papas</td>
    </tr>

    <tr>
        <td class="bold">Address:</td>
        <td colspan="3">Independence Day 5th str, 11511</td>
    </tr>

    <tr>
        <td colspan="4" class="bold">Order Details</td>
    </tr>

    <tr>
        <td>1</td>
        <td>Of Mice and Men</td>
        <td>Book</td>
        <td class="right">10.00€</td>
    </tr>

    <tr>
        <td>2</td>
        <td>Les Miserables</td>
        <td>Book</td>
        <td class="right">12.00€</td>
    </tr>

    <tr>
        <td>3</td>
        <td>Game of Thrones - S01</td>
        <td>DVD</td>
        <td class="right">50.00€</td>
    </tr>

    <tr>
        <td>4</td>
        <td>Samsung Galaxy</td>
        <td>Mobile Phone</td>
        <td class="right">200.00€</td>
    </tr>

    <tr>
        <td colspan="3" class="bold right">Total:</td>
        <td class="right">272.00€</td>
    </tr>

</table>

</body>
</html>
